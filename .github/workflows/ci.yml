name: ci
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # ubuntu-24.04, not -latest: the newer image has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - name: The tests that need no other tool (the rest are skipped)
        run: python -m unittest discover -s tests

  with-the-real-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Install leash, skillgate and mandata
        run: |
          pip install git+https://github.com/patkusch/leash git+https://github.com/patkusch/skillgate git+https://github.com/patkusch/mandata
      - name: All the tests, including the ones that run the real tools
        run: python -m unittest discover -s tests -v
      - name: The healthy example passes and the risky one fails
        run: |
          python -m agentcheck examples/healthy
          ! python -m agentcheck examples/risky
      - name: Leaving a tool out of a run
        run: python -m agentcheck examples/healthy --skip leash
      - name: mandata checks this repo's own instruction file
        run: mandata . --exclude examples
